<title>불법광고 신고 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 지점 선택 + 실행 한 줄, 그 아래 4개 탭(블로그/카페/플레이스/수동확인)에 URL 목록. 그 외 없음. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --panel-2: #eaeef2; --line: #d5dbe2; --line-strong: #b9c2cc;
  --fg: #16202a; --fg-2: #4e5b68; --fg-3: #7b8794;

  --warn: #b7791f; --warn-soft: #fff3d6; --err: #b3413b; --err-soft: #fde4e1; --ok: #2e7d4f; --ok-soft: #dcf2e4;
  --mark: #fff0a8;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181f; --panel: #1a222b; --panel-2: #222c37; --line: #2e3a47; --line-strong: #43515f;
  --fg: #e8edf2; --fg-2: #aab6c2; --fg-3: #7c8a98;
  --accent: #4fb3bf; --accent-fg: #0c1418; --accent-soft: #163a3f;
  --warn: #e2a53a; --warn-soft: #3a2d12; --err: #e2685f; --err-soft: #3d1d1a; --ok: #5cbf85; --ok-soft: #14301f;
  --mark: #5a4a0f;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12181f; --panel: #1a222b; --panel-2: #222c37; --line: #2e3a47; --line-strong: #43515f;
  --fg: #e8edf2; --fg-2: #aab6c2; --fg-3: #7c8a98;
  --accent: #4fb3bf; --accent-fg: #0c1418; --accent-soft: #163a3f;
  --warn: #e2a53a; --warn-soft: #3a2d12; --err: #e2685f; --err-soft: #3d1d1a; --ok: #5cbf85; --ok-soft: #14301f;
  --mark: #5a4a0f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }

.wrap { max-width: 1000px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.runbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.runbar select { padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); min-width: 160px; font-weight: 600; }
.runbar .kw { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
.runbar .spacer { flex: 1; }
.runbar .who { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); }
.runbar .who input { width: 100px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.btn { padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--fg-2); min-height: 20px; }
.status.err { color: var(--err); }
.banner { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; border: 1px solid; }
.banner.warn { background: var(--warn-soft); border-color: var(--warn); }
.banner.err { background: var(--err-soft); border-color: var(--err); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { padding: 8px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; background: none; color: var(--fg-2); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--font-mono); font-size: 12px; background: var(--panel-2); padding: 0 6px; border-radius: 999px; }
.tab.on { background: var(--panel); border-color: var(--line); color: var(--fg); margin-bottom: -1px; font-weight: 600; }
.tab.on .n { background: var(--accent-soft); color: var(--accent); }
.tab.manual.on .n { background: var(--err-soft); color: var(--err); }

.pane { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.toolbar .spacer { flex: 1; }
.toolbar label { display: flex; gap: 4px; align-items: center; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.row:last-child { border-bottom: 0; }
.row.done { opacity: .55; }
.row input[type=checkbox] { margin-top: 4px; width: 16px; height: 16px; }
.row .t { font-weight: 600; }
.row .d { font-size: 13px; color: var(--fg-2); }
.row .u { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
.row .m { font-size: 12px; color: var(--fg-3); display: flex; gap: 10px; flex-wrap: wrap; }
.row .clinic { font-size: 12px; color: var(--accent); font-weight: 600; }
.row .side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 600; white-space: nowrap; }
.empty { padding: 32px 16px; text-align: center; color: var(--fg-2); }
.empty code { font-family: var(--font-mono); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 60; }
.copybox { font-family: var(--font-mono); font-size: 12px; white-space: pre; overflow: auto; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg); max-height: 260px; }
@media (max-width: 600px) { .row { grid-template-columns: 24px minmax(0, 1fr); } .row .side { grid-column: 2; flex-direction: row; } .runbar select { min-width: 120px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <h1>불법광고 신고 관리</h1>
  <div id="banner" class="banner warn" hidden></div>

  <div class="runbar">
    <select id="region"></select>
    <span class="kw" id="kw"></span>
    <button class="btn primary" id="run">실행</button>
    <span class="spacer"></span>
    <label class="who">담당자 <input id="who" placeholder="이름" autocomplete="off"></label>
  </div>
  <div class="status" id="status"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="blog">블로그 <span class="n">0</span></button>
    <button class="tab" data-t="cafe">카페 <span class="n">0</span></button>
    <button class="tab" data-t="place">플레이스 <span class="n">0</span></button>
    <button class="tab manual" data-t="manual">수동확인 필요 <span class="n">0</span></button>
  </div>
  <div class="pane">
    <div class="toolbar">
      <label><input type="checkbox" id="selAll"> 전체 선택</label>
      <label><input type="checkbox" id="hideDone" checked> 신고한 건 숨기기</label>
      <span class="spacer"></span>
      <button class="btn small" id="copySel">URL 복사</button>
      <button class="btn small primary" id="markSel">신고함 처리</button>
      <button class="btn small" id="copyAll">지역 전체 복사</button>
    </div>
    <div class="rows" id="rows"></div>
    <div class="copybox" id="copybox" hidden></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const REGIONS = [{"id": "bf91277b21", "name": "강남", "keywords": ["강남피부과"]}, {"id": "546eb949b1", "name": "선릉", "keywords": ["선릉피부과"]}, {"id": "fa42e37fe4", "name": "잠실", "keywords": ["잠실피부과"]}, {"id": "fb071c54ca", "name": "왕십리", "keywords": ["왕십리피부과"]}, {"id": "e34ece8b8e", "name": "명동", "keywords": ["명동피부과"]}, {"id": "c52a6e5d6c", "name": "홍대신촌", "keywords": ["홍대신촌피부과", "홍대피부과", "신촌피부과"]}, {"id": "0fd350bf45", "name": "영등포", "keywords": ["영등포피부과"]}, {"id": "3a30cb67cb", "name": "마곡", "keywords": ["마곡피부과"]}, {"id": "91cb47e210", "name": "건대", "keywords": ["건대피부과"]}, {"id": "68c8dd7ffb", "name": "구로", "keywords": ["구로피부과"]}, {"id": "8a31e1ce84", "name": "여의도", "keywords": ["여의도피부과"]}, {"id": "99277c61c8", "name": "천호", "keywords": ["천호피부과"]}, {"id": "f1f35bf12b", "name": "목동", "keywords": ["목동피부과"]}, {"id": "ce8776d868", "name": "창동", "keywords": ["창동피부과"]}, {"id": "6e967544d0", "name": "노원", "keywords": ["노원피부과"]}, {"id": "c69da27153", "name": "상봉망우", "keywords": ["상봉망우피부과", "상봉피부과", "망우피부과"]}, {"id": "08ccbbe912", "name": "수원", "keywords": ["수원피부과"]}, {"id": "63cfc188c0", "name": "판교", "keywords": ["판교피부과"]}, {"id": "fd653bcbfb", "name": "광교", "keywords": ["광교피부과"]}, {"id": "ad2166ef70", "name": "광명", "keywords": ["광명피부과"]}, {"id": "2146f149b4", "name": "산본", "keywords": ["산본피부과"]}, {"id": "894682d981", "name": "부천", "keywords": ["부천피부과"]}, {"id": "e5e1de8ef9", "name": "일산", "keywords": ["일산피부과"]}, {"id": "db0d82edd0", "name": "다산", "keywords": ["다산피부과"]}, {"id": "f9f7f4282f", "name": "김포", "keywords": ["김포피부과"]}, {"id": "6da3abcd38", "name": "인천검단", "keywords": ["인천검단피부과", "검단피부과", "인천피부과"]}, {"id": "cd791d3412", "name": "동탄", "keywords": ["동탄피부과"]}, {"id": "f560dc603d", "name": "평택", "keywords": ["평택피부과"]}, {"id": "a730c37194", "name": "안양", "keywords": ["안양피부과"]}, {"id": "f0371e158b", "name": "부평", "keywords": ["부평피부과"]}, {"id": "d26daca828", "name": "안산", "keywords": ["안산피부과"]}, {"id": "6ea0267a4d", "name": "의정부", "keywords": ["의정부피부과"]}, {"id": "aa9aa26131", "name": "시흥배곧", "keywords": ["시흥배곧피부과", "시흥피부과", "배곧피부과"]}, {"id": "ad45d7ec84", "name": "분당미금", "keywords": ["분당미금피부과", "분당피부과", "미금피부과"]}, {"id": "0ddbb816b2", "name": "과천", "keywords": ["과천피부과"]}, {"id": "115166aa86", "name": "하남미사", "keywords": ["하남미사피부과", "하남피부과", "미사피부과"]}, {"id": "523647724c", "name": "화성봉담", "keywords": ["화성봉담피부과", "봉담피부과"]}, {"id": "1059b5491e", "name": "경기광주", "keywords": ["경기광주피부과"]}, {"id": "ffee12337a", "name": "천안", "keywords": ["천안피부과"]}, {"id": "1e783cc6f7", "name": "대전", "keywords": ["대전피부과"]}, {"id": "ad0d7d4bdf", "name": "광주", "keywords": ["광주피부과"]}, {"id": "27f5a39c16", "name": "목포", "keywords": ["목포피부과"]}, {"id": "604f78d405", "name": "대구", "keywords": ["대구피부과"]}, {"id": "25f016f2a4", "name": "부산", "keywords": ["부산피부과"]}, {"id": "d517715adc", "name": "창원", "keywords": ["창원피부과"]}];
  const OWN_BRAND = ["유앤아이의원", "유앤아이 의원", "유앤아이피부과", "유앤아이"];
  const SERVER = 'PlayMCP';
  const TOOLS = { blog: 'NaverSearch-search_blog', cafe: 'NaverSearch-search_cafearticle', place: 'NaverSearch-search_local' };
  const TOP_N = 30, PLACE_N = 5;
  const TAB_LABEL = { blog: '블로그', cafe: '카페', place: '플레이스', manual: '수동확인' };
  const $ = (s) => document.querySelector(s);
  const today = () => new Date().toISOString().slice(0, 10);

  let db = null, mcp = null, unsubRes = null, unsubRep = null;
  let region = REGIONS[0];
  let results = null;         // {run_at, by, blog:[], cafe:[], place:[]}
  let reported = {};          // urlKey -> {url, at, by}
  let tab = 'blog';
  const schemaCache = {};

  // ---------- 공통 ----------
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  function setStatus(m, err) { const s = $('#status'); s.textContent = m; s.classList.toggle('err', !!err); }
  function banner(m, cls) { const b = $('#banner'); b.textContent = m || ''; b.className = 'banner ' + (cls || 'warn'); b.hidden = !m; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function strip(s) { return String(s || '').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'").trim(); }
  function key(url) { let h = 5381, g = 52711; for (let i = 0; i < url.length; i++) { const c = url.charCodeAt(i); h = ((h * 33) ^ c) >>> 0; g = ((g * 33) ^ c) >>> 0; } return h.toString(16).padStart(8, '0') + g.toString(16).padStart(8, '0'); }
  function who() { return $('#who').value.trim(); }
  const CLINIC_RE = /([가-힣A-Za-z0-9&·]{2,14}(?:피부과의원|피부과|의원|클리닉|성형외과|메디컬))/g;
  function isOwn(text) { const t = (text || '').replace(/\s/g, ''); return OWN_BRAND.some((b) => t.includes(b.replace(/\s/g, ''))); }
  function findClinics(text) {
    const out = new Set();
    for (const m of (text || '').matchAll(CLINIC_RE)) {
      const name = m[1];
      if (/^(피부과|의원|클리닉|성형외과|메디컬)$/.test(name)) continue;
      if (region.keywords.includes(name)) continue;                      // "강남피부과" 같은 검색어 자체
      if (/^(동네|근처|추천|유명|좋은|괜찮은|저렴한|싼|가까운|인근|여기|우리|이|그|저)/.test(name)) continue;
      out.add(name);
    }
    return [...out];
  }
  function highlight(text, names) { let h = esc(text); names.forEach((n) => { h = h.split(esc(n)).join(`<mark>${esc(n)}</mark>`); }); return h; }

  // ---------- 저장소 ----------
  window.claude?.use('db').then((d) => { db = d; if (!db) { banner('공유 저장소에 연결되지 않아 신고 기록이 저장되지 않습니다. claude.ai에 로그인한 상태로 다시 열어 주세요.', 'err'); } subscribe(); });
  window.claude?.use('mcp').then((m) => { mcp = m; if (!mcp) { banner('네이버 검색 커넥터를 쓸 수 없어 실행이 되지 않습니다. claude.ai 설정 → 커넥터에서 PlayMCP(네이버 검색)를 연결한 뒤 다시 열어 주세요.', 'err'); $('#run').disabled = true; } });

  function subscribe() {
    if (unsubRes) unsubRes(); if (unsubRep) unsubRep();
    results = null; reported = {};
    if (!db) { render(); return; }
    unsubRes = db.doc('results/' + region.id).onSnapshot((s) => { results = s.exists ? s.data() : null; render(); }, (e) => setStatus('저장소 오류: ' + e.code, true));
    unsubRep = db.doc('reported/' + region.id).onSnapshot((s) => { reported = (s.exists && s.data().urls) || {}; render(); }, () => {});
  }

  // ---------- 검색 ----------
  async function inputFor(tool, keyword, n) {
    let schema = schemaCache[tool];
    if (schema === undefined) { try { schema = (await mcp.describeTool(SERVER, tool)).inputSchema || null; } catch (e) { schema = null; } schemaCache[tool] = schema; }
    const props = (schema && schema.properties) || {};
    const pick = (cands) => cands.find((c) => c in props);
    const qk = pick(['query', 'keyword', 'q', 'search', 'searchQuery', 'text']) || 'query';
    const dk = pick(['display', 'count', 'limit', 'num', 'size']);
    const sk = pick(['sort']);
    const input = { [qk]: keyword };
    if (dk) input[dk] = n;
    if (sk) input[sk] = 'sim';
    return input;
  }
  function extractItems(payload) {
    // 네이버 API 형식 {items:[{title, link, description, ...}]} 우선, 아니면 객체 트리에서 link+title 을 찾고, 마지막으로 텍스트에서 URL 만
    const found = [];
    const walk = (v, depth) => {
      if (!v || depth > 6) return;
      if (Array.isArray(v)) { v.forEach((x) => walk(x, depth + 1)); return; }
      if (typeof v === 'object') {
        if ((v.link || v.url) && (v.title || v.name)) { found.push({ title: strip(v.title || v.name), link: String(v.link || v.url), desc: strip(v.description || v.snippet || v.summary || ''), extra: v }); return; }
        Object.values(v).forEach((x) => walk(x, depth + 1));
      }
    };
    let p = payload;
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* 텍스트 */ } }
    if (typeof p === 'string') {
      const urls = p.match(/https?:\/\/[^\s"'<>)]+/g) || [];
      return urls.map((u) => ({ title: '', link: u, desc: '', extra: {} }));
    }
    walk(p, 0);
    return found;
  }
  function normBlog(u) { const m = u.match(/blog\.naver\.com\/([A-Za-z0-9_\-.]+)\/(\d+)/); return m ? `https://blog.naver.com/${m[1]}/${m[2]}` : u.split('?')[0]; }
  function normCafe(u) { const m = u.match(/cafe\.naver\.com\/([A-Za-z0-9_\-.]+)\/(\d+)/); return m ? `https://cafe.naver.com/${m[1]}/${m[2]}` : u; }

  async function search(kind, keyword, n) {
    const input = await inputFor(TOOLS[kind], keyword, n);
    const r = await mcp.callTool(SERVER, TOOLS[kind], input, { cache: false });
    return extractItems(r.payload !== undefined ? r.payload : r);
  }

  async function run() {
    if (!mcp) return;
    const btn = $('#run'); btn.disabled = true;
    const out = { run_at: new Date().toISOString().slice(0, 16).replace('T', ' '), by: who(), keywords: region.keywords, blog: [], cafe: [], place: [], own_skipped: 0, errors: [] };
    const seen = new Set();
    try {
      for (const kw of region.keywords) {
        for (const kind of ['blog', 'cafe', 'place']) {
          setStatus(`${region.name} · "${kw}" ${TAB_LABEL[kind]} 검색 중…`);
          let items;
          try { items = await search(kind, kw, kind === 'place' ? PLACE_N : TOP_N); }
          catch (e) { out.errors.push(`${kw} ${TAB_LABEL[kind]}: ${describeError(e)}`); if (['needs_reauth', 'server_not_connected', 'not_in_manifest', 'blocked_by_policy', 'not_granted'].includes(e && e.code)) throw e; continue; }
          items.forEach((it, i) => {
            const text = it.title + ' ' + it.desc + ' ' + (it.extra.bloggername || it.extra.cafename || '');
            if (isOwn(text)) { out.own_skipped++; return; }
            let link = it.link;
            if (kind === 'blog') link = normBlog(link); else if (kind === 'cafe') link = normCafe(link);
            const k = kind + ':' + (kind === 'place' ? it.title : link);
            if (seen.has(k)) return; seen.add(k);
            const row = { url: link, title: it.title, desc: it.desc, keyword: kw, rank: i + 1, clinics: findClinics(text) };
            if (kind === 'place') { row.address = strip(it.extra.roadAddress || it.extra.address || ''); row.url = it.link && /naver\.com/.test(it.link) ? it.link : `https://map.naver.com/p/search/${encodeURIComponent(it.title + ' ' + (row.address ? row.address.split(' ').slice(0, 2).join(' ') : region.name))}`; row.clinics = [it.title]; }
            else row.author = strip(it.extra.bloggername || it.extra.cafename || '');
            out[kind].push(row);
          });
        }
      }
      const total = out.blog.length + out.cafe.length + out.place.length;
      if (db) { try { await db.doc('results/' + region.id).set(out); } catch (e) { out.errors.push('저장 실패: ' + (e && e.code)); results = out; render(); } }
      else { results = out; render(); }
      setStatus(`완료: 블로그 ${out.blog.length} · 카페 ${out.cafe.length} · 플레이스 ${out.place.length}` + (out.own_skipped ? ` (자사 ${out.own_skipped}건 제외)` : '') + (out.errors.length ? ` · 오류 ${out.errors.length}건` : ''), out.errors.length > 0 && total === 0);
      if (out.errors.length) banner(out.errors.join(' / '), total ? 'warn' : 'err'); else banner('');
    } catch (e) {
      setStatus('실행 실패: ' + describeError(e), true);
    } finally { btn.disabled = false; }
  }
  function describeError(e) {
    const c = e && e.code;
    if (c === 'needs_reauth') return 'PlayMCP 커넥터 로그인이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결하세요.';
    if (c === 'server_not_connected') return 'PlayMCP 커넥터가 연결되어 있지 않습니다. claude.ai 설정 → 커넥터에서 PlayMCP 를 추가하고 네이버 검색을 켜세요.';
    if (c === 'not_in_manifest') return '이 페이지의 PlayMCP 사용을 허용하지 않았습니다. 새로고침 후 허용을 눌러 주세요.';
    if (c === 'selection_required') return 'PlayMCP 커넥터가 여러 개라 선택이 필요합니다. 화면의 선택 창에서 하나를 고르세요.';
    if (c === 'tool_error') return '검색 도구 오류: ' + (e.message || '').slice(0, 200);
    if (c === 'server_unavailable') return '네이버 검색 서버가 응답하지 않습니다. 잠시 후 다시 실행하세요.';
    return (c || '알 수 없는 오류') + (e && e.message ? ': ' + String(e.message).slice(0, 200) : '');
  }

  // ---------- 탭 데이터 ----------
  function rowsFor(t) {
    if (!results) return [];
    if (t === 'place') return results.place || [];
    if (t === 'manual') return [...(results.blog || []).filter((r) => !r.clinics.length).map((r) => Object.assign({ kind: 'blog' }, r)), ...(results.cafe || []).filter((r) => !r.clinics.length).map((r) => Object.assign({ kind: 'cafe' }, r))];
    return (results[t] || []).filter((r) => r.clinics.length);
  }
  function isDone(r) { return !!reported[key(r.url)]; }

  // ---------- 렌더 ----------
  function render() {
    for (const t of ['blog', 'cafe', 'place', 'manual']) { const all = rowsFor(t); const open = all.filter((r) => !isDone(r)).length; $(`.tab[data-t="${t}"] .n`).textContent = open === all.length ? all.length : `${open}/${all.length}`; }
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
    const hide = $('#hideDone').checked;
    const list = rowsFor(tab).filter((r) => !hide || !isDone(r));
    const rows = $('#rows');
    if (!results) { rows.innerHTML = `<div class="empty">지점을 고르고 <b>실행</b>을 누르면 "${esc(region.keywords.join('", "'))}" 로 검색한 결과가 탭별로 정리됩니다.</div>`; $('#selAll').checked = false; return; }
    if (!list.length) { rows.innerHTML = `<div class="empty">${hide && rowsFor(tab).length ? '모두 신고한 건입니다. "신고한 건 숨기기"를 끄면 보입니다.' : '해당 없음'}</div>`; $('#selAll').checked = false; return; }
    rows.innerHTML = list.map((r, i) => {
      const done = reported[key(r.url)];
      const names = r.clinics || [];
      const title = highlight(r.title || '(제목 없음)', names);
      const desc = highlight(r.desc || '', names);
      const meta = [r.kind ? TAB_LABEL[r.kind] : '', r.keyword ? `검색어 ${r.keyword}` : '', r.rank ? `${r.rank}위` : '', r.author ? `작성자 ${r.author}` : '', r.address || ''].filter(Boolean).map(esc).join('<span>·</span>');
      return `<div class="row ${done ? 'done' : ''}" data-i="${i}">
        <input type="checkbox" data-sel ${done ? 'disabled' : ''}>
        <div>
          <div class="t">${title}</div>
          ${names.length && tab !== 'place' ? `<div class="clinic">특정 병원: ${names.map(esc).join(', ')}</div>` : ''}
          ${desc ? `<div class="d">${desc}</div>` : ''}
          <a class="u" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
          <div class="m">${meta}</div>
        </div>
        <div class="side">${done ? `<span class="tag">신고함 ${esc(done.at)}${done.by ? ' · ' + esc(done.by) : ''}</span><button class="btn small" data-undo>되돌리기</button>` : `<button class="btn small primary" data-mark>신고함</button>`}</div>
      </div>`;
    }).join('');
    rows.querySelectorAll('.row').forEach((el) => {
      const r = list[+el.dataset.i];
      const m = el.querySelector('[data-mark]'); if (m) m.onclick = () => mark([r], true);
      const u = el.querySelector('[data-undo]'); if (u) u.onclick = () => mark([r], false);
    });
    $('#selAll').checked = false;
  }

  function selectedRows() {
    const list = rowsFor(tab).filter((r) => !$('#hideDone').checked || !isDone(r));
    const picked = [...$('#rows').querySelectorAll('.row')].filter((el) => el.querySelector('[data-sel]').checked).map((el) => list[+el.dataset.i]);
    return picked.length ? picked : list.filter((r) => !isDone(r));
  }
  async function mark(rs, on) {
    if (!db) { toast('저장소 연결이 없어 기록할 수 없습니다'); return; }
    const urls = {};
    rs.forEach((r) => { urls[key(r.url)] = on ? { url: r.url, at: today(), by: who(), kind: r.kind || tab, title: (r.title || '').slice(0, 80) } : { __delete__: true }; });
    try {
      const ref = db.doc('reported/' + region.id);
      const snap = await ref.get();
      if (snap.exists) await ref.update({ urls }); else if (on) await ref.set({ region: region.name, urls });
      toast(on ? `${rs.length}건 신고함 처리` : '되돌렸습니다');
    } catch (e) { toast('기록 실패: ' + (e && e.code)); }
  }

  // ---------- 복사 ----------
  function block(t, rs) {
    const lines = [`■ ${TAB_LABEL[t]} (${rs.length}건)`];
    rs.forEach((r, i) => {
      lines.push(`${i + 1}. ${r.url}`);
      if (t !== 'place' && r.clinics && r.clinics.length) lines.push(`   - 특정 병원: ${r.clinics.join(', ')}`);
      if (t === 'place') lines.push(`   - 업체: ${r.title}${r.address ? ' (' + r.address + ')' : ''}`);
      else if (r.title) lines.push(`   - 제목: ${r.title}`);
    });
    return lines.join('\n');
  }
  async function copy(text) {
    $('#copybox').textContent = text; $('#copybox').hidden = false;
    try { await navigator.clipboard.writeText(text); toast('복사했습니다'); }
    catch (e) { const range = document.createRange(); range.selectNodeContents($('#copybox')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); toast('복사가 막혀 있어 아래 텍스트를 선택했습니다. Ctrl+C'); }
  }

  // ---------- 이벤트 ----------
  const sel = $('#region');
  sel.innerHTML = REGIONS.map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
  function pickRegion(id) { region = REGIONS.find((r) => r.id === id) || REGIONS[0]; sel.value = region.id; $('#kw').textContent = region.keywords.join(' · '); try { localStorage.setItem('adwatch_region', region.id); } catch (e) { /* 무시 */ } subscribe(); setStatus(''); banner(''); $('#copybox').hidden = true; }
  sel.onchange = () => pickRegion(sel.value);
  $('#run').onclick = run;
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.t; $('#copybox').hidden = true; render(); });
  $('#selAll').onchange = (e) => $('#rows').querySelectorAll('[data-sel]:not(:disabled)').forEach((c) => { c.checked = e.target.checked; });
  $('#hideDone').onchange = render;
  $('#copySel').onclick = () => { const rs = selectedRows(); if (!rs.length) { toast('복사할 항목이 없습니다'); return; } copy(`# ${region.name} (${today()})\n\n` + block(tab, rs) + '\n'); };
  $('#markSel').onclick = () => { const rs = selectedRows(); if (!rs.length) { toast('처리할 항목이 없습니다'); return; } mark(rs, true); };
  $('#copyAll').onclick = () => {
    const parts = ['blog', 'cafe', 'place'].map((t) => { const rs = rowsFor(t).filter((r) => !isDone(r)); return rs.length ? block(t, rs) : ''; }).filter(Boolean);
    if (!parts.length) { toast('복사할 항목이 없습니다'); return; }
    copy(`# ${region.name} (${today()})\n\n` + parts.join('\n\n') + '\n');
  };
  try { $('#who').value = localStorage.getItem('adwatch_who') || ''; } catch (e) { /* 무시 */ }
  $('#who').oninput = () => { try { localStorage.setItem('adwatch_who', $('#who').value); } catch (e) { /* 무시 */ } };
  let saved = null; try { saved = localStorage.getItem('adwatch_region'); } catch (e) { /* 무시 */ }
  pickRegion(saved || REGIONS[0].id);
})();
</script>
