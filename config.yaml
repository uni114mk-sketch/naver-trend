# 자사 식별용. 병원명이나 글 본문에 아래 문자열이 있으면 "자사"로 분류해 신고 대상에서 제외합니다.
own_brand_keywords: [유앤아이의원, 유앤아이 의원, 유앤아이피부과, 유앤아이]

# 자사 공식 채널 (blog.naver.com/아이디, cafe.naver.com/카페아이디). 비워 두면 브랜드 키워드로만 제외합니다.
own_channels:
  blog_ids: []
  cafe_ids: []

collect:
  media: [blog, cafe, place]   # 수집할 매체
  top_n: 30                    # 블로그탭/카페탭 상위 N개
  place_top_n: 10              # 플레이스 상위 N개
  use_search_tab: true         # true: Playwright로 실제 검색탭 열람 / false: 검색 API만 사용
  max_images_per_post: 6       # 판정에 넣을 본문 이미지 수 (많을수록 비용 증가)
  delay_seconds: 2             # 요청 간 대기 (차단 방지)

classify:
  model: claude-opus-5
  effort: medium

report:
  pptx_per_item_slides: true   # false면 지역별 요약 슬라이드만 생성

storage:
  db_path: adwatch.db
  output_dir: output
